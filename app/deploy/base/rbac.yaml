apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: memory-reader
  namespace: memory-app
rules:
  - apiGroups: [""]
    resources:
      - pods
      - events
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: memory-reader
  namespace: memory-app
subjects:
  - kind: ServiceAccount
    name: python-app-sa
    namespace: memory-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: memory-reader