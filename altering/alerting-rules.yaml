apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubernetes-pod-health-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: kubernetes.pod.health
      rules:
        # Alerts when a Running pod remains unready.
        - alert: KubernetesPodNotReady
          expr: |
            (
              kube_pod_status_ready{
                condition="true",
                namespace!~"kube-system|monitoring"
              } == 0
            )
            and on (namespace, pod)
            (
              kube_pod_status_phase{
                phase="Running",
                namespace!~"kube-system|monitoring"
              } == 1
            )
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Kubernetes pod is not ready"
            description: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} has been running but not Ready for more than 5 minutes.'

        # Alerts when a container was OOMKilled recently and its restart counter increased.
        - alert: KubernetesContainerOOMKilled
          expr: |
            (
              max_over_time(
                kube_pod_container_status_last_terminated_reason{
                  reason="OOMKilled",
                  namespace!~"kube-system|monitoring"
                }[10m]
              ) == 1
            )
            and on (namespace, pod, container)
            (
              increase(
                kube_pod_container_status_restarts_total{
                  namespace!~"kube-system|monitoring"
                }[10m]
              ) > 0
            )
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Container was OOMKilled"
            description: 'Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled and restarted within the last 10 minutes.'

