name: PR Security and Quality Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test, Scan, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and tools
        working-directory: app
        run: |
          pip install flake8 bandit pytest pip-audit

      - name: Python linting
        working-directory: app
        run: flake8 . --exclude=.venv,venv,__pycache__

      - name: Unit tests
        working-directory: app
        run: pytest -q

      - name: SAST with Bandit
        working-directory: app
        run: |
          bandit -r . -x ./tests -s B104

      - name: Secret scanning with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          load: true
          tags: memory-app:pr-validation

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: memory-app:pr-validation
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
