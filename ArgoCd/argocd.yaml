apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: memory-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Kiruthik25/DevSecOps-Assessment.git
    targetRevision: HEAD
    path: app/deploy/base

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
